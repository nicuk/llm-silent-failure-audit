<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 572" width="1280" height="572" role="img" aria-label="What the scanner looks for: numbers fed by nothing, failures that look like success, and checks and costs that cannot fail">
<style>
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="1278" height="570" rx="28" fill="#F6F9FF" stroke="#DCE5F5" stroke-width="2"/>
<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0A6CFF">WHAT THE SCANNER LOOKS FOR</text>
<g class="pop" style="animation-delay:0.20s"><rect x="40" y="80" width="384" height="5" rx="2.5" fill="#0A6CFF"/><text x="40" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Numbers fed by nothing</text><text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5B6B85">the score looks fine and means nothing</text></g><g class="pop" style="animation-delay:0.90s"><rect x="40" y="164" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">reader-no-writer</text><text x="70" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">a score input that nothing writes</text></g><g class="pop" style="animation-delay:1.02s"><rect x="40" y="256" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">metric-coalesce</text><text x="70" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">?? 0 on a score, cost or count</text></g><g class="pop" style="animation-delay:1.14s"><rect x="40" y="348" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">debug-gated-telemetry</text><text x="70" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">cost and usage recorded only in debug</text></g><g class="pop" style="animation-delay:0.45s"><rect x="448" y="80" width="384" height="5" rx="2.5" fill="#6CCBFF"/><text x="448" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Failures that look like success</text><text x="448" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5B6B85">no error, no 500, just a wrong number</text></g><g class="pop" style="animation-delay:1.26s"><rect x="448" y="164" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">fallback-fabricates</text><text x="478" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">a failure that returns a believable 0</text></g><g class="pop" style="animation-delay:1.38s"><rect x="448" y="256" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">swallowed-error</text><text x="478" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">an empty catch near model or cost code</text></g><g class="pop" style="animation-delay:1.50s"><rect x="448" y="348" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">fire-and-forget-meter</text><text x="478" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">a meter write whose failure vanishes</text></g><g class="pop" style="animation-delay:1.62s"><rect x="448" y="440" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">model-id</text><text x="478" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">a retired model failing into a fallback</text></g><g class="pop" style="animation-delay:0.70s"><rect x="856" y="80" width="384" height="5" rx="2.5" fill="#D97706"/><text x="856" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Checks and costs that can't fail</text><text x="856" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5B6B85">green builds, open-ended bills</text></g><g class="pop" style="animation-delay:1.74s"><rect x="856" y="164" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#D97706" stroke-opacity=".6" stroke-width="2"/><text x="886" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">eval-cannot-fail</text><text x="886" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">an assertion or threshold that always passes</text></g><g class="pop" style="animation-delay:1.86s"><rect x="856" y="256" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#D97706" stroke-opacity=".6" stroke-width="2"/><text x="886" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">eval-placeholder</text><text x="886" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">eval cases that quietly skip themselves</text></g><g class="pop" style="animation-delay:1.98s"><rect x="856" y="348" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#D97706" stroke-opacity=".6" stroke-width="2"/><text x="886" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">llm-call-uncapped</text><text x="886" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">no output-token cap in reach</text></g><g class="pop" style="animation-delay:2.10s"><rect x="856" y="440" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#D97706" stroke-opacity=".6" stroke-width="2"/><text x="886" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">loop-uncapped</text><text x="886" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">a retry loop with no visible bound</text></g>
</svg>
